project:
  type: website
  render:
    - "*.qmd"


website:
  title: "Holly's Academic Portfolio"
  site-url: "https://hollydlopez.gihub.io"
  repo-url: "https://github.com/hollydlopez"
  favicon: files/images/Banner.jpg
  #google-analytics: "UA-177339812-1"
  twitter-card: false
  #back-to-top-navigation: true
  page-navigation: false
  search: true
  page-footer:
    background: "##F6F5F3"
    center: © 2025  &middot; Made with {{< fa brands r-project >}} and
      [![](https://quarto.org/quarto.png){fig-alt="Quarto" width=65px}](https://quarto.org/)
    right:
      - icon: github
        href: https://github.com/hollydlopez

  navbar:
    search: true
    title: false
    logo: images/logo.drawio.png
    background: "#FF9058"
    logo-alt: "Holly Lopez"
    left:
      - href: about_me.qmd
        text: About me
      - href: projects.qmd
        text: Projects
      - href: publications.qmd
        text: Publications
      - href: files/ProfCV_FA2025.pdf
      - href: contact.qmd
        text: Contact

  sidebar:
#  link each group of sidebar entries with a navbar entry by matching their titles and listing the page linked from the navbar as the first content in the sidebar
    - id: dmref
      title: "NSF DMREF"
      # logo: "images/dmref-logo.png"
      logo-href: dmref/index.qmd #avail quarto v 1.5
      contents:
        - href: dmref/index.qmd
          text: Welcome to DMREF
        - href: dmref/people/index.qmd
          text: The DMREF Team
        - href: dmref/publications/index.qmd
          text: DMREF-Related Publications
        - href: dmref/codes/index.qmd
          text: Computer Codes
        - href: dmref/data/index.qmd
          text: Team Data

    - id: empty-to-suppress-sidebars-on-other-pages


format:
  html:
    theme:
      - styles/custom.scss
      - yeti
    mainfont: Helvetica
    toc: true
    link-external-newwindow: true
    date-format: "MMM YYYY"
    smooth-scroll: true
    resources:
      - images
